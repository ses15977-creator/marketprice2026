name: Import verified observations
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'collectors/observations.csv'
      - 'collectors/import_csv.py'
      - '.github/workflows/import-observations.yml'
permissions:
  contents: read
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate credentials
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::notice::Import not configured. Add both repository Actions secrets to enable."
            exit 0
          fi
          python3 collectors/import_csv.py collectors/observations.csv
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
